[package]
name = "sshweaver"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sshweaver_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
rusqlite_migration = { version = "2.6.0", features = ["from-directory"] }
include_dir = "0.7.4"
uuid = { version = "1.23.3", features = ["v4"] }
tauri-specta = { version = ">=2.0.0-rc, <3", features = ["typescript", "derive"] }
specta-typescript = "0.0.12"
specta = ">=2.0.0-rc, <3"
russh = { version = "0.61.2", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "2"
tokio = { version = "1.52.3", features = ["sync", "macros", "io-util", "rt", "net", "time", "fs"] }
anyhow = "1.0.102"
zeroize = "1.8"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = "0.3"


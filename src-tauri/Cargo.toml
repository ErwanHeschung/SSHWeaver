[package]
name = "sshweaver"
version = "0.2.2"
description = "A modern SSH and SFTP client"
authors = ["Erwan Heschung <mailme@heschungerwan.dev>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sshweaver_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rusqlite_migration = { version = "2.6.0", features = ["from-directory"] }
include_dir = "0.7.4"
uuid = { version = "1.26.0", features = ["v4"] }
tauri-specta = { version = ">=2.0.0-rc, <3", features = ["typescript", "derive"] }
specta-typescript = "0.0.12"
specta = ">=2.0.0-rc, <3"
russh = { version = "0.63.1", default-features = false, features = [
    "ring",
    "flate2",
    "rsa",
    # Infra this talks to can be old: DSA host keys and 3des-cbc are the
    # only thing some of it offers.
    "dsa",
    "des",
] }
russh-sftp = "2"
tokio = { version = "1.53.1", features = ["sync", "macros", "io-util", "rt", "net", "time", "fs"] }
anyhow = "1.0.104"
zeroize = "1.8"
keyring-core = "1"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = "0.3"
serialport = { version = "4", default-features = false } # libudev off: avoids a system dep on Linux CI

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { version = "1", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
dbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

